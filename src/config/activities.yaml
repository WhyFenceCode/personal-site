# Activity blocks for the "Off the clock" section. Which ones show, their order and width are
# set in home.yaml.

# Books come from the plain-text file src/data/reading.txt. Only the yearly goal lives here.
reading:
  goal: 7

# Hand-entered. Change it whenever you like; nothing updates automatically.
listening:
  updated: 2026-10
  nowPlaying: { song: "Come Out and Play", artist: The Offspring }   # the song on repeat, then who made it
  topArtists: [Rihanna, Taylor Swift, The Offspring, Anti-Flag, Paris Paloma]

# Distance moved, all activities together. The block hides itself when nothing was logged in the last
# `activeWithinDays` days, so a quiet season simply disappears from the page.
training:
  source: import            # import | static. import reads src/data/training.json (pnpm strava:import); without it the numbers below are used
  unit: km
  activeWithinDays: 30
  # Used when source is static, and as the fallback before the first import:
  lastActivity: 2026-10-24
  weeks: [18, 22, 0, 25, 31, 28, 12, 35, 30, 33, 41, 26, 0, 38, 44, 40, 36, 47, 29, 42, 50, 46, 31, 52, 48, 39]   # 26 weekly km, oldest first
  longest: { km: 21.1, type: Run, date: 2026-09-14 }

# A link card to your photography site (no photos are shown here).
# The optional banner at the very top of the page is configured in site.yaml under `banner`.
photography:
  url: "https://photos.torstenyoung.com"
  label: See the photographs
  description: Film and digital, whatever happens to catch my eye.
  meta: Film · Digital

# Places come from the plain-text file src/data/places.txt.
places:
  title: Places

languages:
  items:
    - { name: English, level: 5, note: Native }
    - { name: German, level: 5, note: Native }
    - { name: French, level: 2, note: Learning }

# Optional "Uses" block: what's on your desk. Add `- { id: uses, size: 2 }` to home.yaml to show it. The items below are placeholders: replace them before showing it. The `groups` array can be any number of groups, each with a name and a list of items.
uses:
  groups:
    - name: Desk
      items: [MacBook Pro 14", LG UltraFine 5K, Keychron Q1 (brown switches), Logitech MX Master 3S]
    - name: Software
      items: [Figma, VS Code, Raycast, Arc]
    - name: Camera
      items: [Olympus OM-1, Fujifilm X100V]
