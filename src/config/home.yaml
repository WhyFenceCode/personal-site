# The home page below the name block, top to bottom.
# Reorder, remove or repeat entries to change the page. Nothing else needs editing.
#
# Every section accepts:
#   tone: light | dark      (optional; when left out, sections alternate starting with dark)
#   cta:  { label: <i18n key>, to: <page> }   pages: home, work, resume, about, contact, or a full URL
#   hidden: true            (keeps the entry here but doesn't render it)

sections:
  - type: marquee
    # The words in the scrolling band
    items: [Engineering, Front-end Design, Learning, Photography]

  - type: education
    show: 2                 # number of featured entries (set featured: true in the Markdown)
    cta: { label: cta.fullResume, to: resume }

  - type: github
    weeks: 53
    cta: { label: cta.allProjects, to: work }

  - type: certifications   # hidden until you add an education entry with kind: certificate
    cta: { label: cta.fullResume, to: resume }

  - type: projects
    limit: 4
    cta: { label: cta.allProjects, to: work }

  - type: experience
    cta: { label: cta.fullResume, to: resume }

  - type: activities
    # Blocks in display order. size: 1 or 2 columns, or 4 for a full row.
    # Block ids: reading, listening, training, photography, places, languages, uses.
    # training (distance from all activities) hides itself when there's no recent activity (see activities.yaml).
    blocks:
      - { id: reading, size: 1 }
      - { id: listening, size: 1 }
      - { id: training, size: 2 }
      - { id: places, size: 4 }
      - { id: photography, size: 2 }
      - { id: languages, size: 2 }
      # - { id: uses, size: 2 }
    cta: { label: cta.aboutMe, to: about }

  - type: contact
