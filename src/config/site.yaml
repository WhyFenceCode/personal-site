# Site-wide settings. Every page reads from here.
# Text that changes per language (tagline, labels, CTAs) lives in src/i18n/<lang>.yaml.

name: Torsten Young
email: contact@torstenyoung.com
url: https://torstenyoung.com

location:
  city: Kingston
  region: "Ontario"                # province or state, e.g. Ontario. Helps the city lookup.
  country: Canada
  timezone: auto           # auto = worked out from the city when the site builds. Or set one, e.g. America/Toronto

# Languages are detected from this list. The first one is the default.
# One language hides the switch, two shows a toggle, three or more shows a dropdown.
# Each language needs src/i18n/<code>.yaml. Content falls back to the default language
# when a translated Markdown file is missing.
languages: [en]

socials:
  - { label: GitHub, url: "https://github.com/WhyFenceCode" }
  - { label: LinkedIn, url: "https://www.linkedin.com/in/torsten-young/" }

github:
  username: "WhyFenceCode"              # your GitHub handle. Public contributions only. Empty = sample data.

resume:
  pdf: ""                  # e.g. /resume.pdf (file in /public) or a full URL. Empty hides the download buttons.

# Your photo. Used on the About page and as the image when the site is shared (link previews).
portrait:
  enabled: false             # false hides it everywhere; the About page goes text-only
  src: /portrait.jpg        # put the file in /public. A placeholder shows until it exists.
  alt: Portrait of Torsten Young

# Slim bar at the very top of the page, e.g. pointing to your photography site.
banner:
  enabled: true
  pages: home               # home | all
  text: I also take photographs.
  label: Visit the photo site
  url: "https://photos.torstenyoung.com"
  dismissible: true

# Type choices.
#   numbers:  serif | outline           big numbers: education years, stats, loader
#   headings: display | serif | outline section and page titles
# One accent colour, used sparingly (3D mouse light, live markers, focus rings, text selection, GitHub peaks).
# Pick it with private/brandkit/index.html. Must be a 6-digit hex.
theme:
  accent: "#7E76D0"         # soft blue-violet
  accentCursor: false       # the cursor dot turns accent over links and buttons
  logoDot: true             # an accent full stop after your name in the header and footer
  headingEcho: true         # an accent outline copy behind section headings, drifting with the pointer (off with motion off)

# Interactive extras. Set any to false to switch it off. Anything that moves also stops when a visitor turns
# motion off (footer) or has reduced motion set on their device.
interactive:
  build: true               # /build: a crowd of cursors builds the home page live (Shift+B or Cmd/Ctrl+B, or the home page hint)
  tiltCards: true           # cards tilt toward the pointer, with an accent outline drifting behind them
  record: true              # drag the Listening record to spin it
  magnetic: true            # main buttons lean toward the pointer
  depth: true               # headings and numbers drift at slightly different speeds as you scroll
  sheen: false              # a faint blue-violet light follows the pointer across the page
  pageTilt: true            # pages tilt in 3D as they change
  wind: false               # marquee words lean with how fast you scroll
  githubCity: false         # "3D" switch on the GitHub calendar
  signature: true           # your name drawn as a signature in the contact section

typography:
  numbers: outline
  headings: display

features:
  loader: true              # intro animation, once per browser session
  pageTransitions: true     # ink flood between pages
  cursorRing: true          # inverting dot cursor (hides the system cursor for mice, except in high-contrast modes)

# Analytics. See README "Analytics" for the trade-offs.
#   provider: none | cloudflare | plausible | umami | goatcounter
#   consent:  the banner only appears when this is true. Cookieless providers usually don't need it.
analytics:
  provider: cloudflare
  consent: false
  token: ""                 # cloudflare: beacon token · umami: website id · goatcounter: site code
  domain: torstenyoung.com    # plausible: your domain
  src: ""                   # optional: custom script URL (e.g. a self-hosted Umami or Plausible)

legal:
  owner: Torsten Young
  jurisdiction: Canada
  imprint: false            # an imprint (German "Impressum") is only required for sites run from Germany/Austria
  address: []               # optional mailing address, e.g. [Street 1, City, Province, Postal code]. Empty = email is the contact.
  hosting: "Cloudflare, Inc."               # your host's name once chosen, e.g. Cloudflare. Named in the privacy policy.
  updated: 2026-10-27
