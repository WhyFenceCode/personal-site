# Settings for the resume page. Roles and education come from src/content (Markdown).

# The timeline spans your roles and degrees automatically: from the earliest start to this year
# (or your latest end date). Uncomment to force a wider or narrower range.
timeline: {}
  # timeline: { from: 2020, to: 2030 }

# Skills, grouped. "rating" is a simple 1–5 score and fills that many of the five squares. SAMPLE DATA.
skills:
  - group: Engineering
    items:
      - { name: Fusion, rating: 3 }
      - { name: Excel, rating: 3 }
      - { name: OpenFOAM, rating: 1 }
      - { name: Drafting, rating: 3 }
      - { name: OnShape, rating: 4 }
  - group: Programming
    items:
      - { name: C, rating: 2 }
      - { name: HTML, rating: 4 }
      - { name: CSS, rating: 4 }
      - { name: JavaScript, rating: 3 }
      - { name: Rust, rating: 1 }
  - group: Web Design
    items:
      - { name: Figma, rating: 3 }
      - { name: Blender, rating: 2 }
      - { name: Git, rating: 5 }
      - { name: Astro.js, rating: 3 }
      - { name: Tailwind CSS, rating: 4 }
