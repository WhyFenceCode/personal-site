# Settings for the resume page. Roles and education come from src/content (Markdown).

timeline:
  from: 2013                # first year shown on the scrubbable timeline
  to: 2026                  # last year shown

# Skills, grouped. "years" fills the squares (out of 10). SAMPLE DATA.
skills:
